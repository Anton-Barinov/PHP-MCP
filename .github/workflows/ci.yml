name: CI Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_sqlite, mbstring

      - name: Run PHP Syntax Check
        run: |
          find src/ -name "*.php" -exec php -l {} \;
          php -l bin/php-mcp

      - name: Run PHP-MCP Test Suites
        run: |
          php tests/run_tests.php
